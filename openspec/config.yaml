schema: spec-driven

context: |
  Projekt: drone-inventory, SYP-Schulprojekt zur Drohnenverwaltung.
  Grundlage: Auftraggeber-Vorgaben und README.md; ein separater SYP-Projektauftrag
  liegt derzeit nicht im Repository vor. Fehlende Anforderungen nicht erfinden.
  Sprache: Deutsch; OpenSpec-Strukturüberschriften und SHALL/MUST bleiben Englisch.

  Architektur: ASP.NET Core 10 Web API im Backend, Angular im Frontend,
  Kommunikation über REST/JSON. Entity Framework Core und SQLite sind vorgesehen,
  aber noch nicht eingerichtet. Beide Projekte sind derzeit Grundgerüste.
  Das Backend setzt die Fachregeln durch; das Frontend bedient die API.

  Ausschließlich diese Domänenbegriffe verwenden:
  - Drone: eine verwaltete Drohne.
  - StudentGroup: eine Gruppe, die Drohnen ausleiht.
  - Loan: eine Ausleihe an eine StudentGroup, aktiv bis zur Rückgabe.
  - LoanItem: Zuordnung einer Drone zu einer Loan mit Zubehörmengen.

  Verbindliche Fachregeln:
  - Eine Drone darf höchstens einer aktiven Loan zugeordnet sein.
  - Nur verfügbare Drones dürfen ausgeliehen werden.
  - Rückgaben beenden die aktive Loan und machen deren Drones wieder verfügbar.
  - Zubehörmengen dürfen nicht negativ sein.
  - Zurückgegebene Loans und ihre LoanItems bleiben gespeichert.
  - Zubehör wird ausschließlich als Menge verwaltet, ohne eigene Identitäten.
  - Verfügbarkeit ergibt sich aus aktiven Loans, ohne unabhängig gepflegten Zustand.

  Out of Scope: Login, Benutzerrollen, einzelne Akku-IDs, Reservierungen,
  Schadensverwaltung, Statistiken und Exporte.

  Vor fachlicher Implementierung OpenSpec verwenden; siehe AGENTS.md.
  Aktueller Auftrag: ausschließlich Einrichtung, keinen Change vorschlagen,
  REQ-001 bis REQ-010 nicht implementieren, keine Geschäftslogik oder Datenbank
  erstellen und keine GitHub Issues erzeugen.

rules:
  proposal:
    - Beschreibe Ziel, beobachtbares Verhalten und Out of Scope.
    - Verwende ausschließlich Drone, StudentGroup, Loan und LoanItem als Domänenbegriffe.
    - Verknüpfe vorhandene Issues und REQ-Kennungen; erfinde keine Anforderungen.
  specs:
    - Beschreibe beobachtbares Verhalten statt Implementierungsdetails wie Klassen, Tabellen oder Algorithmen.
    - "Verwende je Anforderung mindestens ein Szenario mit der Überschrift '#### Scenario:'."
    - Jedes Szenario enthält explizit GIVEN (Ausgangslage), WHEN (Aktion) und THEN (beobachtbares Ergebnis).
    - Verwende SHALL/MUST für normative Anforderungen und ausschließlich die vier Domänenbegriffe.
    - Berücksichtige die Fachregeln sowie passende Erfolgs- und Fehlerfälle.
  design:
    - Halte technische Entscheidungen getrennt von verhaltensorientierten Spezifikationen fest.
    - Beachte Architektur und Out of Scope aus dem Projektkontext.
  tasks:
    - Leite Aufgaben aus den Spezifikationen ab und verknüpfe sie mit vorhandenen Issues.
    - Plane passende Prüfungen des spezifizierten Verhaltens ein.
